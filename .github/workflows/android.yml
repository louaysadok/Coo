name: Build Android APK

on:
  push:
    branches: [arena/bed5214f-coo, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # The repo stores only Dart code. Generate the Android platform folder
      # here so the project builds on a clean checkout.
      - name: Generate Android project files
        run: |
          flutter create --platforms=android --project-name polite_scraper \
            --org com.louaysadok /tmp/android-gen
          cp -r /tmp/android-gen/android ./android
          rm -f test/widget_test.dart

      - name: Allow internet access in the release build
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perm = '<uses-permission android:name="android.permission.INTERNET"/>'
          if perm not in s:
              s = s.replace('<application', perm + '\n    <application', 1)
              p.write_text(s)
          print('INTERNET permission present:', perm in p.read_text())
          EOF

      - name: Fetch packages
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: polite-scraper-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
