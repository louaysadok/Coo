name: Build signed APK

# Why this exists: the sandbox this project was written in can reach github.com but not
# dl.google.com / maven.google.com / services.gradle.org, so the Android SDK, Gradle and the AndroidX
# artifacts cannot be fetched there. GitHub Actions can. The workflow therefore builds the release
# APK, verifies it, then commits it to dist/ on the same branch so it can be pulled back with git.
#
# The [skip ci] guard is what stops the APK commit from triggering another build.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" | tail -3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Read version
        id: version
        run: |
          NAME=$(grep '^ERT_VERSION_NAME=' gradle.properties | cut -d= -f2)
          CODE=$(grep '^ERT_VERSION_CODE=' gradle.properties | cut -d= -f2)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building ERT v$NAME (versionCode $CODE)"

      - name: Unit tests (pure-Kotlin core, no SDK needed)
        run: |
          npm install -g kotlin-compiler@2.4.21
          export JDK_HOME="$JAVA_HOME"
          export KOTLINC="$(npm root -g)/kotlin-compiler/bin/kotlinc"
          chmod +x tools/run-tests.sh
          ./tools/run-tests.sh

      - name: Assemble release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ERT-v${{ steps.version.outputs.name }}.apk"
          ls -l dist/

      - name: Verify signature
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs -v "dist/ERT-v${{ steps.version.outputs.name }}.apk"

      - name: Dump badging
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt2" dump badging "dist/ERT-v${{ steps.version.outputs.name }}.apk" | head -20
          echo "SHA-256:" && sha256sum "dist/ERT-v${{ steps.version.outputs.name }}.apk"

      - name: Commit APK to branch
        run: |
          git config user.name "ERT build bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -f "dist/ERT-v${{ steps.version.outputs.name }}.apk"
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit"
          else
            git commit -m "chore(apk): ERT v${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }}) [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload artifact (secondary path)
        uses: actions/upload-artifact@v4
        with:
          name: ERT-v${{ steps.version.outputs.name }}
          path: dist/ERT-v${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
