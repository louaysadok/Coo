# ===== Memory (the sandbox/low-RAM story: small heap, in-process Kotlin) =====
org.gradle.jvmargs=-Xmx1100m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true

# ===== Android =====
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false

# ===== App version (bump versionCode on EVERY build so updates install cleanly) =====
ERT_VERSION_CODE=1
ERT_VERSION_NAME=1.0

# ===== Signing (personal throwaway key, committed on purpose so updates install over each other) =====
ERT_KEYSTORE=keystore/ert-release.jks
ERT_STORE_PASS=ert4ndr01d
ERT_KEY_ALIAS=ert
ERT_KEY_PASS=ert4ndr01d
